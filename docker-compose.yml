# PostgreSQL local para desarrollo: docker compose up -d
# Conexión: postgres://traza:traza@localhost:5432/traza
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: traza
      POSTGRES_PASSWORD: traza
      POSTGRES_DB: traza
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traza"]
      interval: 5s
      retries: 10
volumes:
  datos-postgres:
